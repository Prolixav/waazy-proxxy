<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>wavy</title>
    
    <!-- Fixed font paths so the website design actually displays -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0c0a17; color: #f1eff9; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #131124; padding: 16px 24px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 30px rgba(0,0,0,0.6); z-index: 10; border-bottom: 1px solid #201b3a; }
        .logo { font-size: 26px; font-weight: 900; background: linear-gradient(135deg, #ff6ec7, #7873f5, #4adede); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; cursor: pointer; }
        
        .search-bar { flex: 1; display: flex; background: #1a1730; border: 1px solid #2b264d; border-radius: 30px; padding: 4px 6px; align-items: center; }
        .search-bar input { flex: 1; padding: 10px 16px; border: none; background: transparent; color: #fff; font-size: 15px; outline: none; }
        .search-bar input::placeholder { color: #645f8a; }
        .search-bar button { padding: 10px 26px; border: none; border-radius: 30px; background: linear-gradient(135deg, #7873f5, #4adede); color: #fff; font-weight: 700; cursor: pointer; }
        
        .workspace { flex: 1; display: flex; flex-direction: column; padding: 60px 40px; overflow-y: auto; align-items: center; gap: 48px; }
        .grid-wrapper { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        .grid-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #5d578c; border-bottom: 1px solid #1a1730; padding-bottom: 8px; }
        
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .app-card { background: #131124; border: 1px solid #1d1936; border-radius: 20px; padding: 24px; text-align: center; cursor: pointer; transition: 0.2s; }
        .app-card:hover { transform: translateY(-4px); background: #191630; }
        .app-icon { font-size: 42px; margin-bottom: 8px; }
        .app-name { font-weight: 700; font-size: 16px; color: #fff; }
        .app-desc { font-size: 12px; color: #696394; line-height: 1.5; }
        
        .viewport-panel { flex: 1; width: 100%; height: 100%; background: #fff; display: none; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
    
    <script>
        function startProxySession(target) {
            let address = target || document.getElementById('target-input').value;
            if (!address) return;
            
            let targetUrl = address.trim();
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }
            
            document.getElementById('main-dashboard').style.display = 'none';
            document.getElementById('session-viewport').style.display = 'block';
            
            // This safely links up to your active Render server backend rules
            document.getElementById('frame-engine').src = '/proxy?url=' + encodeURIComponent(targetUrl);
        }

        function triggerCheck(e) { if (e.key === 'Enter') startProxySession(); }
        
        function returnToDashboard() {
            document.getElementById('session-viewport').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'flex';
            document.getElementById('frame-engine').src = 'about:blank';
            document.getElementById('target-input').value = '';
        }
    </script>
</head>
<body>

    <div class="header">
        <div class="logo" onclick="returnToDashboard()">wavy</div>
        <div class="search-bar">
            <input type="text" id="target-input" onkeypress="triggerCheck(event)" placeholder="Search anonymously without trackers...">
            <button onclick="startProxySession()">Explore</button>
        </div>
    </div>

    <div class="workspace" id="main-dashboard">
        <div class="grid-wrapper">
            <div class="grid-title">Proxy Routing Gateways</div>
            <div class="app-grid">
                <div class="app-card" onclick="startProxySession('https://poki.com')">
                    <div class="app-icon">🎮</div>
                    <div class="app-name">Poki Node</div>
                    <div class="app-desc">Bypass filters to run unblocked casual games.</div>
                </div>
                <div class="app-card" onclick="startProxySession('https://crazygames.com')">
                    <div class="app-icon">⚡</div>
                    <div class="app-name">CrazyGames Stream</div>
                    <div class="app-desc">High performance core arcade layout.</div>
                </div>
                <div class="app-card" onclick="startProxySession('https://retrobowl.me')">
                    <div class="app-icon">🏈</div>
                    <div class="app-name">Retro Bowl Mirror</div>
                    <div class="app-desc">Run unblocked football simulation scripts.</div>
                </div>
                <div class="app-card" onclick="startProxySession('https://discord.com')">
                    <div class="app-icon">💬</div>
                    <div class="app-name">Discord Tunnel</div>
                    <div class="app-desc">Encrypted communications shortcut container.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="viewport-panel" id="session-viewport">
        <iframe id="frame-engine" src="about:blank"></iframe>
    </div>

</body>
</html>
